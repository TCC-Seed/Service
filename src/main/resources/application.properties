spring.application.name=tcc-seed

# O schema é gerenciado pelos scripts SQL executados como proprietário do banco.
# A role app_backend não deve executar ALTER TABLE durante a inicialização.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.docker.compose.enabled=false

jwt.secret=${JWT_SECRET}
