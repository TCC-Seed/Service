name: SonarCloud

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    environment: SONAR_ORGANIZATION
    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/tcc_seed_ci
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: ci-only-test-jwt-secret-long-enough-for-the-minimum-length
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tcc_seed_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tcc_seed_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # Secrets are unavailable to pull requests from forks. Keep their build
    # running, but only send analyses when this repository can authenticate.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validar configuração do SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: |
          test -n "$SONAR_TOKEN" || { echo "Configure o secret SONAR_TOKEN nas configurações do repositório."; exit 1; }
          test -n "$SONAR_ORGANIZATION" || { echo "Configure a variável SONAR_ORGANIZATION com a organization key do SonarCloud."; exit 1; }

      - name: Build, testes, cobertura e análise
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
        run: >
          mvn -B clean verify
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.host.url=https://sonarcloud.io
          -Dsonar.organization="$SONAR_ORGANIZATION"
          -Dsonar.projectKey=TCC-Seed_Service
          -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
