services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=${POSTGRES_DB}'
      - 'POSTGRES_PASSWORD=${POSTGRES_PASSWORD}'
      - 'POSTGRES_USER=${POSTGRES_USER}'
      - 'SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no .env}'
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/pessoais/DDL.sql:/docker-entrypoint-initdb.d/01-DDL.sql:ro
      - ./db/pessoais/ROLE.sh:/docker-entrypoint-initdb.d/02-ROLE.sh:ro
      - ./db/pessoais/ROLE.sql:/tmp/ROLE.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  app:
    build:
      context: .
      dockerfile: Dockerfile-dev
    ports:
      - '8080:8080'
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=app_backend
      - 'SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:?Defina SPRING_DATASOURCE_PASSWORD no .env}'
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - maven-repo:/root/.m2
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
  maven-repo:
